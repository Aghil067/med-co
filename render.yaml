services:
  - type: web
    name: med-co-twin
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --prefix client --include=dev && npm ci --prefix server/notifications --omit=dev && npm run build --prefix client
    startCommand: node server/notifications/relay.cjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: MED_CO_HOST_FRONTEND
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: med-co-push
          property: connectionString
databases:
  - name: med-co-push
    region: singapore
    plan: free
    ipAllowList: []
